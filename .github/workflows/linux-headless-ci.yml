name: Linux Headless CI

on:
  pull_request:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
  push:
    branches: [master]
    paths-ignore:
      - "**/*.md"
      - "doc/**"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: linux-headless-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  BUILD_DIR: toonz/sources/build
  QT_QPA_PLATFORM: offscreen

jobs:
  build-and-test:
    name: Ubuntu 22.04 / GCC / Qt 5
    runs-on: ubuntu-22.04
    timeout-minutes: 90

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            build-essential cmake pkg-config ninja-build ccache \
            libboost-all-dev qtbase5-dev qt5-qmake qtscript5-dev qttools5-dev \
            qttools5-dev-tools qtmultimedia5-dev libqt5svg5-dev libqt5opengl5-dev \
            libqt5multimedia5-plugins libqt5serialport5-dev libsuperlu-dev liblz4-dev \
            libusb-1.0-0-dev liblzo2-dev libpng-dev libjpeg-dev libglew-dev \
            freeglut3-dev libfreetype6-dev libjson-c-dev libmypaint-dev \
            libopencv-dev libturbojpeg-dev libomp-dev zlib1g-dev libopenblas-dev

      - name: Restore compiler cache
        uses: actions/cache@v4
        with:
          path: ~/.cache/ccache
          key: ${{ runner.os }}-gcc-ccache-${{ hashFiles('toonz/sources/**/*.cpp', 'toonz/sources/**/*.h', 'toonz/sources/**/CMakeLists.txt') }}
          restore-keys: |
            ${{ runner.os }}-gcc-ccache-

      - name: Configure compiler cache
        run: |
          ccache --set-config=max_size=1G
          ccache --zero-stats

      - name: Build bundled TIFF
        working-directory: thirdparty/tiff-4.0.3
        run: |
          CFLAGS="-fPIC" CXXFLAGS="-fPIC" ./configure --disable-jbig
          make -j"$(nproc)"

      - name: Configure OpenToonz headless
        run: |
          cmake -S toonz/sources -B "$BUILD_DIR" -G Ninja \
            -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_C_COMPILER_LAUNCHER=ccache \
            -DCMAKE_CXX_COMPILER_LAUNCHER=ccache

      - name: Build OpenToonz headless
        run: cmake --build "$BUILD_DIR" --target toonz_headless --parallel "$(nproc)"

      - name: Run JSON-RPC smoke test
        run: |
          python3 - <<'PY'
          import json
          import os
          import subprocess
          import sys

          binary = os.path.join(os.environ["BUILD_DIR"], "bin", "toonz_headless")
          process = subprocess.Popen(
              [binary],
              stdin=subprocess.PIPE,
              stdout=subprocess.PIPE,
              stderr=subprocess.PIPE,
              text=True,
              bufsize=1,
              env={**os.environ, "QT_QPA_PLATFORM": "offscreen"},
          )

          try:
              ready = json.loads(process.stdout.readline())
              assert ready.get("method") == "ready", ready

              requests = [
                  {"id": 1, "method": "ping", "params": {}},
                  {"id": 2, "method": "eval", "params": {"code": "print(6 * 7)"}},
                  {"id": 3, "method": "quit", "params": {}},
              ]

              responses = {}
              for request in requests:
                  process.stdin.write(json.dumps(request) + "\n")
                  process.stdin.flush()
                  response = json.loads(process.stdout.readline())
                  responses[response["id"]] = response

              assert responses[1]["result"] == "pong", responses[1]
              assert responses[2]["result"]["ok"] is True, responses[2]
              assert responses[2]["result"]["output"].strip() == "42", responses[2]
              assert responses[3]["result"] == "bye", responses[3]

              return_code = process.wait(timeout=15)
              assert return_code == 0, return_code
              print("JSON-RPC smoke test passed")
          except Exception:
              process.kill()
              stderr = process.stderr.read()
              if stderr:
                  print(stderr, file=sys.stderr)
              raise
          PY

      - name: Show compiler cache statistics
        if: always()
        run: ccache --show-stats

      - name: Upload headless binary
        uses: actions/upload-artifact@v4
        with:
          name: opentoonz-headless-linux-x64
          path: toonz/sources/build/bin/toonz_headless
          if-no-files-found: error
          retention-days: 7
